services:
  postgres:
    image: postgres:16-alpine
    container_name: ${PROJECT_NAME:-phongtzzz}_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-phongtzzz}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-phongtzzz}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - phongtzzz_net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME:-phongtzzz}_api
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-phongtzzz}
      FRONTEND_URL: ${PUBLIC_FRONTEND_URL:-http://localhost:5173}
      ADMIN_URL: ${PUBLIC_ADMIN_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    networks:
      - phongtzzz_net

  landing:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    container_name: ${PROJECT_NAME:-phongtzzz}_landing
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "5173"
    ports:
      - "127.0.0.1:${LANDING_PORT:-5173}:5173"
    networks:
      - phongtzzz_net

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    container_name: ${PROJECT_NAME:-phongtzzz}_admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    depends_on:
      - api
    expose:
      - "3000"
    ports:
      - "127.0.0.1:${ADMIN_PORT:-3000}:3000"
    networks:
      - phongtzzz_net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ${PROJECT_NAME:-phongtzzz}_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - landing
      - admin
      - api
    networks:
      - phongtzzz_net
    profiles:
      - tunnel

volumes:
  postgres_data:

networks:
  phongtzzz_net:
    driver: bridge
