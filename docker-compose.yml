services:
  postgres:
    image: postgres:16-alpine
    container_name: ${PROJECT_NAME:-riverside_haven}_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-riverside_haven}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-riverside_haven}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - riverside_net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME:-riverside_haven}_api
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-Riverside Haven Booking API}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-before-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-riverside_haven}
      FRONTEND_URL: ${PUBLIC_FRONTEND_URL:-http://localhost:5173}
      ADMIN_URL: ${PUBLIC_ADMIN_URL:-http://localhost:3000}
      CORS_EXTRA_ORIGINS: ${CORS_EXTRA_ORIGINS:-http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@riversidehaven.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123456}
      HOMESTAY_EMAIL: ${HOMESTAY_EMAIL:-stayhostelbar@gmail.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@riversidehaven.local}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Riverside Haven Booking}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      MEDIA_ROOT: /data/uploads
      MEDIA_URL_PREFIX: /uploads
      INITIAL_SITE_TEMPLATE: ${INITIAL_SITE_TEMPLATE:-booking}
    volumes:
      - ./data/uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - riverside_net

  landing:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    container_name: ${PROJECT_NAME:-riverside_haven}_landing
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./data/uploads:/app/dist/uploads:ro
    expose:
      - "5173"
    ports:
      - "127.0.0.1:${LANDING_PORT:-5173}:5173"
    networks:
      - riverside_net

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_FRONTEND_URL:-http://localhost:5173}
    container_name: ${PROJECT_NAME:-riverside_haven}_admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
      NEXT_PUBLIC_SITE_URL: ${PUBLIC_FRONTEND_URL:-http://localhost:5173}
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    ports:
      - "127.0.0.1:${ADMIN_PORT:-3000}:3000"
    networks:
      - riverside_net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ${PROJECT_NAME:-riverside_haven}_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - landing
      - admin
      - api
    networks:
      - riverside_net
    profiles:
      - tunnel

volumes:
  postgres_data:

networks:
  riverside_net:
    driver: bridge
